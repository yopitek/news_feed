name: Fetch Raw Feeds (no LLM)

# Fetch-only export for downstream readers (docs/feed_raw.json, docs/feed_health.json).
# No API keys, no email, about one minute. Runs before the 07:00 Asia/Taipei reader.
#
# The minute is deliberately not :00. GitHub delays scheduled runs under load and
# the top of the hour is the worst slot: the daily digest is scheduled for
# 00:00 UTC and its commits land between 04:25 and 07:57 UTC.
# This workflow was delayed too: the 22:23 UTC run started at 04:19 UTC (2026-11-27)
# and 03:58 UTC (2026-11-28), about 6 hours late. Three spread-out slots make it
# likely that at least one finishes before the morning reader; a GX10 timer also
# triggers workflow_dispatch (not delayed) when the data is still from yesterday.
on:
  schedule:
    - cron: '23 18 * * *'   # 02:23 Asia/Taipei
    - cron: '43 20 * * *'   # 04:43 Asia/Taipei
    - cron: '23 22 * * *'   # 06:23 Asia/Taipei
  workflow_dispatch:

concurrency:
  group: fetch-raw
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch every source
        env:
          TZ: Asia/Taipei
        run: python -m src.export_raw --out docs

      - name: Report problem sources
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('docs/feed_raw.json')
          if not p.exists():
              print('::error::docs/feed_raw.json was not written')
              raise SystemExit(0)
          raw = json.loads(p.read_text(encoding='utf-8'))
          for s in raw.get('problem_sources', []):
              print(f"::warning::{s['health']}: {s['tab']} / {s['category']} / {s['source_name']} - {s.get('error') or s.get('status')} - {s['url']}")
          for c in raw.get('empty_categories', []):
              print(f"::warning::empty category: {c['tab']} / {c['category']}")
          print(raw.get('health_summary'))
          PY

      - name: Commit
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/feed_raw.json docs/feed_health.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh raw feeds $(date +'%Y-%m-%d %H:%M')"
          # The daily digest and the social snapshot sync push to the same branch:
          # rebase onto the latest main before every attempt; retry 3 times, 20 s apart.
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::push attempt $attempt failed, retrying in 20 s"
              sleep 20
            fi
          done
          echo "::error::push failed after 1 attempt and 3 retries"
          exit 1
