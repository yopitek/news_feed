# Weekly AI Digest via Twitter/X + Tavily Search
name: Weekly AI Digest
on:
  schedule:
    # Monday 00:00 UTC = 08:00 Taipei
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install tavily-python
          
      - name: Run weekly pipeline
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1/chat/completions
          # Same model id as daily_digest.yml. minimaxai/minimax-m2.1 is not in
          # NVIDIA's catalog (see the note in daily_digest.yml): every call 404'd.
          NVIDIA_MODEL: meta/llama-3.2-11b-vision-instruct
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Accept either naming: daily_digest.yml and commit fffa2f8 show the
          # repo secrets are SMTP_SERVER/SMTP_USERNAME; fall back if only the
          # SMTP_HOST/SMTP_USER spellings exist.
          SMTP_HOST: ${{ secrets.SMTP_HOST || secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          python -m src.weekly_main
          
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-digest
          path: output/weekly/*.html
          retention-days: 30
          
      - name: Send failure notification
        if: failure()
        run: echo "Weekly digest failed - check artifacts"