name: Daily Multilingual News Digest

on:
  # Scheduled run at 08:00 Asia/Taipei = 00:00 UTC
  schedule:
    - cron: '0 0 * * *'
  
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      skip_email:
        description: 'Skip sending email (for testing)'
        required: false
        default: false
        type: boolean
      debug_mode:
        description: 'Enable debug logging'
        required: false
        default: false
        type: boolean

# Prevent concurrent runs
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  generate-digest:
    name: Generate and Send Digest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      # ============================================
      # Setup
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # ============================================
      # Generate Digest
      # ============================================
      - name: Report snapshot freshness
        continue-on-error: true
        run: |
          python -c "
          import json, pathlib
          from datetime import datetime

          # Dcard is Cloudflare-protected and PTT 403s datacenter IPs, so neither
          # can be fetched from this runner. Both tabs are served from snapshots
          # collected on the operator's machine by tools/daily_social_sync.sh.
          targets = [
              ('data/dcard_latest.json', 'Dcard'),
              ('data/ptt_latest.json',   'PTT'),
          ]
          for rel, label in targets:
              p = pathlib.Path(rel)
              if not p.exists():
                  print(f'::warning::{rel} is missing; the {label} tab will be empty.')
                  continue
              snap = json.loads(p.read_text(encoding='utf-8'))
              collected = datetime.fromisoformat(snap['collected_at'])
              age = (datetime.now(collected.tzinfo) - collected).total_seconds() / 3600
              print(f'{label} snapshot collected {snap[\"collected_at\"]} ({age:.1f}h ago), {len(snap[\"posts\"])} posts')
              if age > 72:
                  print(f'::warning::{label} snapshot is {age:.1f}h old. Run tools/daily_social_sync.sh to refresh it.')
          "

      - name: Run digest pipeline
        id: generate
        env:
          # API Priority: NVIDIA (NIM) > ZEABUR (GPT-4o-mini) > GOOGLE (Gemini) > SILICONFLOW > DEEPSEEK
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1/chat/completions
          # Model id must exist in NVIDIA's catalog: GET https://integrate.api.nvidia.com/v1/models
          # `minimaxai/minimax-m2.1` was set here for a long time but is NOT in that
          # list — no MiniMax model is — so every call returned 404 and all summaries
          # silently fell back to RSS descriptions.
          NVIDIA_MODEL: z-ai/glm-5.3-flash
          ZEABUR_API_KEY: ${{ secrets.ZEABUR_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEBUG_MODE: ${{ inputs.debug_mode || 'false' }}
          TZ: Asia/Taipei
        run: |
          python -m src.main
          echo "digest_generated=true" >> $GITHUB_OUTPUT
      
      # ============================================
      # Send Email
      # ============================================
      - name: Send email digest
        if: ${{ steps.generate.outputs.digest_generated == 'true' && inputs.skip_email != 'true' }}
        continue-on-error: true
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_SUBJECT_PREFIX: '[News Digest]'
        run: |
          python -c "
          from src.mailer import send_digest_email
          result = send_digest_email()
          exit(0 if result else 1)
          "
      
      # ============================================
      # Deploy to GitHub Pages
      # ============================================
      - name: Prepare GitHub Pages
        if: ${{ always() && steps.generate.outputs.digest_generated == 'true' }}
        run: |
          mkdir -p docs
          cp output/web_digest.html docs/index.html
          cp output/articles_data.json docs/articles_data.json 2>/dev/null || true
          cp output/run_summary.json docs/run_summary.json 2>/dev/null || true
          cp output/source_health.json docs/source_health.json 2>/dev/null || true
          echo "GitHub Pages files prepared"
      
      - name: Deploy to GitHub Pages
        if: ${{ always() && steps.generate.outputs.digest_generated == 'true' }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "Update news digest - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
      
      # ============================================
      # Upload Artifacts
      # ============================================
      - name: Upload output artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest-output-${{ github.run_number }}
          path: |
            output/web_digest.html
            output/email_digest.html
            output/run_log.jsonl
            output/run_summary.json
            output/articles_data.json
            output/source_health.json
          retention-days: 30
      
      # ============================================
      # Error Notification (Optional)
      # ============================================
      - name: Notify on failure
        if: failure()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          python -c "
          from src.mailer import send_error_notification
          send_error_notification('${{ github.run_id }}', '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')
          " || true
